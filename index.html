<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prestige Collector's — Arbitrage</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚖️</text></svg>">
<style>
  :root {
    --noir: #1a1612; --brun: #3d2b1f; --or: #c8a96e; --or-clair: #e8d5a3;
    --creme: #f5f0e8; --blanc: #fdfaf4; --gris: #8a7a6a;
    --rouge: #8b2e2e; --vert: #2e5e3e; --bleu: #2c4a7a; --orange: #b7770d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Georgia', serif; background: var(--creme); color: var(--noir); min-height: 100vh; }

  /* NAV */
  nav { background: var(--brun); padding: 0 32px; display: flex; align-items: center; justify-content: space-between; height: 64px; border-bottom: 2px solid var(--or); }
  .nav-logo { color: var(--or); font-size: 20px; letter-spacing: 2px; cursor: pointer; }
  .nav-logo span { color: var(--or-clair); font-size: 11px; display: block; letter-spacing: 3px; text-transform: uppercase; opacity: 0.7; }

  /* PAGES */
  .page { display: none; }
  .page.active { display: block; }

  /* LOGIN */
  .login-wrap { max-width: 380px; margin: 100px auto; padding: 0 24px; }
  .login-box { background: var(--blanc); border: 1px solid var(--or); border-radius: 4px; padding: 48px; text-align: center; }
  .login-box h2 { color: var(--brun); font-size: 26px; margin-bottom: 6px; }
  .login-box p { color: var(--gris); font-family: Arial, sans-serif; font-size: 13px; margin-bottom: 28px; }
  .alerte { padding: 10px 14px; border-radius: 2px; font-family: Arial, sans-serif; font-size: 13px; margin-bottom: 14px; display: none; background: #f4e8e8; border: 1px solid #dfc3c3; color: var(--rouge); }

  /* MAIN */
  .main-layout { max-width: 1200px; margin: 0 auto; padding: 32px 24px; display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  .panel { background: var(--blanc); border: 1px solid #ddd5c8; border-radius: 4px; padding: 28px; }
  .panel-titre { font-size: 18px; color: var(--brun); margin-bottom: 20px; padding-bottom: 12px; border-bottom: 2px solid var(--or); display: flex; align-items: center; gap: 10px; }

  /* FORM */
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 11px; font-family: Arial, sans-serif; text-transform: uppercase; letter-spacing: 1px; color: var(--gris); margin-bottom: 6px; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 10px 14px; border: 1px solid #ddd5c8; border-radius: 2px;
    font-family: Georgia, serif; font-size: 14px; background: var(--creme); color: var(--noir);
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: var(--or); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* UPLOAD */
  .upload-zone { border: 2px dashed #ddd5c8; border-radius: 4px; padding: 24px; text-align: center; cursor: pointer; transition: all 0.2s; background: var(--creme); position: relative; }
  .upload-zone:hover { border-color: var(--or); }
  .upload-zone input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
  .upload-zone p { font-family: Arial, sans-serif; font-size: 13px; color: var(--gris); }
  .photos-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr)); gap: 8px; margin-top: 12px; }
  .photos-grid img { width: 100%; height: 80px; object-fit: cover; border-radius: 3px; border: 1px solid #ddd5c8; }

  /* BOUTONS */
  .btn { padding: 12px 20px; border: none; cursor: pointer; font-family: Arial, sans-serif; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; border-radius: 2px; transition: all 0.2s; }
  .btn-or { background: var(--or); color: var(--brun); font-weight: bold; }
  .btn-or:hover { background: var(--or-clair); }
  .btn-vert { background: var(--vert); color: white; }
  .btn-vert:hover { opacity: 0.9; }
  .btn-brun { background: var(--brun); color: var(--or); }
  .btn-brun:hover { background: var(--noir); }
  .btn-gris { background: #888; color: white; }
  .btn-rouge { background: var(--rouge); color: white; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btns-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }

  /* ANALYSE RÉSULTAT */
  .analyse-box { background: var(--blanc); border: 1px solid #ddd5c8; border-radius: 4px; padding: 24px; margin-top: 0; display: none; }
  .analyse-titre { font-size: 16px; color: var(--brun); margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
  .verdict-box { text-align: center; padding: 20px; border-radius: 4px; margin-bottom: 20px; }
  .verdict-text { font-size: 28px; font-weight: bold; letter-spacing: 2px; }
  .verdict-sous { font-size: 13px; font-family: Arial, sans-serif; margin-top: 6px; opacity: 0.8; }
  .grille-prix { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
  .prix-bloc { border-radius: 4px; padding: 14px; }
  .prix-bloc-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; font-family: Arial, sans-serif; margin-bottom: 6px; font-weight: bold; }
  .prix-bloc-val { font-size: 22px; font-weight: bold; }
  .prix-bloc-sub { font-size: 12px; font-family: Arial, sans-serif; margin-top: 4px; opacity: 0.8; }
  .conseil-box { background: var(--creme); border: 1px solid #ddd5c8; border-radius: 4px; padding: 14px; font-family: Arial, sans-serif; font-size: 13px; line-height: 1.7; }
  .conseil-box strong { color: var(--brun); }
  .loading-box { text-align: center; padding: 32px; font-family: Arial, sans-serif; color: var(--gris); display: none; }
  .loading-spinner { font-size: 32px; animation: spin 1s linear infinite; display: block; margin-bottom: 12px; }
  @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

  /* HISTORIQUE */
  .histo-panel { background: var(--blanc); border: 1px solid #ddd5c8; border-radius: 4px; padding: 28px; grid-column: 1 / -1; }
  .histo-item { background: var(--creme); border: 1px solid #ddd5c8; border-radius: 3px; padding: 16px; margin-bottom: 10px; display: flex; gap: 16px; align-items: flex-start; cursor: pointer; transition: box-shadow 0.2s; }
  .histo-item:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  .histo-img { width: 64px; height: 64px; object-fit: cover; border-radius: 3px; flex-shrink: 0; background: #e8e0d5; display: flex; align-items: center; justify-content: center; font-size: 24px; overflow: hidden; }
  .histo-img img { width: 100%; height: 100%; object-fit: cover; }
  .histo-info { flex: 1; }
  .histo-titre { font-size: 15px; color: var(--brun); margin-bottom: 4px; }
  .histo-meta { font-family: Arial, sans-serif; font-size: 12px; color: var(--gris); }
  .histo-verdict { font-family: Arial, sans-serif; font-size: 13px; font-weight: bold; margin-top: 4px; }
  .histo-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .badge-pays { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-family: Arial, sans-serif; font-weight: bold; margin-right: 6px; }
  .badge-be { background: #e8f0ff; color: #2c4a7a; border: 1px solid #c3cff9; }
  .badge-fr { background: #fff0f0; color: #8b2e2e; border: 1px solid #f9c3c3; }
  .section-vide { text-align: center; color: var(--gris); font-family: Arial, sans-serif; padding: 40px; font-size: 14px; }

  /* MODAL DETAIL */
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 1000; align-items: center; justify-content: center; overflow-y: auto; padding: 20px; }
  .modal.open { display: flex; }
  .modal-box { background: var(--blanc); border: 1px solid var(--or); border-radius: 4px; padding: 36px; max-width: 700px; width: 100%; position: relative; max-height: 90vh; overflow-y: auto; }
  .modal-close { position: absolute; top: 16px; right: 20px; font-size: 24px; cursor: pointer; color: var(--gris); background: none; border: none; }

  /* TAGS */
  .tag-sous { background: #e8f4ec; color: var(--vert); border: 1px solid #c3dfc9; padding: 3px 10px; border-radius: 10px; font-family: Arial; font-size: 12px; font-weight: bold; }
  .tag-sur { background: #f4e8e8; color: var(--rouge); border: 1px solid #dfc3c3; padding: 3px 10px; border-radius: 10px; font-family: Arial; font-size: 12px; font-weight: bold; }
  .tag-juste { background: #f4f0e8; color: var(--orange); border: 1px solid #dfd5c3; padding: 3px 10px; border-radius: 10px; font-family: Arial; font-size: 12px; font-weight: bold; }
</style>
</head>
<body>

<nav>
  <div class="nav-logo" onclick="if(adminConnecte)showPage('main')">
    Prestige Collector's
    <span>Outil d'arbitrage</span>
  </div>
  <div id="nav-right"></div>
</nav>

<!-- LOGIN -->
<div class="page active" id="page-login">
  <div class="login-wrap">
    <div class="login-box">
      <h2>⚖️ Arbitrage</h2>
      <p>Accès réservé</p>
      <div class="alerte" id="alerte-login">Mot de passe incorrect.</div>
      <div class="form-group">
        <label>Mot de passe</label>
        <input type="password" id="login-pwd" autocomplete="new-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()">
      </div>
      <button class="btn btn-or" style="width:100%;padding:14px" onclick="login()">Accéder</button>
    </div>
  </div>
</div>

<!-- MAIN -->
<div class="page" id="page-main">
  <div class="main-layout">

    <!-- PANNEAU ANALYSE -->
    <div class="panel">
      <div class="panel-titre">🔍 Analyser un objet</div>

      <div class="form-row">
        <div class="form-group">
          <label>Titre / Nom de l'objet *</label>
          <input type="text" id="obj-titre" placeholder="Vase Art Déco signé Gallé">
        </div>
        <div class="form-group">
          <label>Catégorie</label>
          <select id="obj-categorie">
            <option>Porcelaine & faïence</option>
            <option>Meubles</option>
            <option>Bijoux & montres</option>
            <option>Livres & gravures</option>
            <option>Tableaux & arts</option>
            <option>Argenterie & métal</option>
            <option>Verrerie & cristal</option>
            <option>Textiles anciens</option>
            <option>Jouets anciens</option>
            <option>Divers</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Prix demandé (€) *</label>
          <input type="number" id="obj-prix" placeholder="150" min="0" step="0.01">
        </div>
        <div class="form-group">
          <label>Pays de provenance</label>
          <select id="obj-pays">
            <option value="BE">🇧🇪 Belgique</option>
            <option value="FR">🇫🇷 France</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>État de l'objet</label>
        <select id="obj-etat">
          <option value="excellent">Excellent — comme neuf</option>
          <option value="tres-bon" selected>Très bon — légères traces d'usage</option>
          <option value="bon">Bon — usures visibles mais complet</option>
          <option value="moyen">Moyen — défauts notables</option>
          <option value="a-restaurer">À restaurer</option>
        </select>
      </div>

      <div class="form-group">
        <label>Notes & observations</label>
        <textarea id="obj-notes" rows="3" placeholder="Signature, dimensions, provenance, particularités, certificat..."></textarea>
      </div>

      <!-- UPLOAD PHOTOS -->
      <div class="form-group">
        <label>Photos</label>
        <div class="upload-zone" id="upload-zone">
          <input type="file" id="obj-photos" accept="image/jpeg,image/png" multiple onchange="handlePhotos(this)">
          <p>📷 Cliquez pour uploader (JPG/PNG, plusieurs photos possibles)</p>
        </div>
        <div class="photos-grid" id="photos-preview"></div>
      </div>

      <div class="btns-row">
        <button class="btn btn-vert" id="btn-analyser" onclick="analyser()">⚖️ Analyser l'arbitrage</button>
        <button class="btn btn-gris" onclick="reset()">🔄 Réinitialiser</button>
      </div>
    </div>

    <!-- PANNEAU RÉSULTAT -->
    <div>
      <div class="loading-box" id="loading-box">
        <span class="loading-spinner">⚖️</span>
        <div style="font-size:15px;color:var(--brun);font-weight:bold;margin-bottom:6px">Analyse en cours...</div>
        <div style="font-size:13px">L'IA compare les marchés belge et français</div>
      </div>

      <div class="analyse-box" id="analyse-box">
        <div class="analyse-titre" id="analyse-titre-obj"></div>

        <!-- VERDICT -->
        <div class="verdict-box" id="verdict-box">
          <div class="verdict-text" id="verdict-text"></div>
          <div class="verdict-sous" id="verdict-sous"></div>
        </div>

        <!-- GRILLE PRIX -->
        <div class="grille-prix" id="grille-prix"></div>

        <!-- COMPARAISON PAYS -->
        <div id="comparaison-pays" style="margin-bottom:16px"></div>

        <!-- CONSEILS -->
        <div class="conseil-box" id="conseil-box"></div>

        <!-- BOUTON SAUVEGARDER -->
        <div class="btns-row" style="margin-top:16px">
          <button class="btn btn-or" onclick="sauvegarderAnalyse()">💾 Sauvegarder dans l'historique</button>
        </div>
      </div>
    </div>

    <!-- HISTORIQUE -->
    <div class="histo-panel">
      <div class="panel-titre">📋 Historique des analyses <span id="histo-count" style="font-size:13px;font-weight:normal;color:var(--gris);font-family:Arial"></span></div>
      <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap">
        <button class="btn btn-gris" style="padding:6px 14px;font-size:12px" onclick="filtrerHisto('tous')">Tous</button>
        <button class="btn btn-gris" style="padding:6px 14px;font-size:12px" onclick="filtrerHisto('SOUS-ÉVALUÉ')">✅ Sous-évalués</button>
        <button class="btn btn-gris" style="padding:6px 14px;font-size:12px" onclick="filtrerHisto('SUR-ÉVALUÉ')">❌ Sur-évalués</button>
        <button class="btn btn-gris" style="padding:6px 14px;font-size:12px" onclick="filtrerHisto('JUSTE PRIX')">⚖️ Juste prix</button>
        <button class="btn btn-rouge" style="padding:6px 14px;font-size:12px;margin-left:auto" onclick="viderHisto()">🗑️ Vider l'historique</button>
      </div>
      <div id="histo-list"><div class="section-vide">Aucune analyse sauvegardée.</div></div>
    </div>

  </div>
</div>

<!-- MODAL DETAIL HISTORIQUE -->
<div class="modal" id="modal-detail">
  <div class="modal-box">
    <button class="modal-close" onclick="document.getElementById('modal-detail').classList.remove('open')">✕</button>
    <div id="modal-detail-content"></div>
  </div>
</div>

<script>
const ADMIN_PWD = '3030';
let adminConnecte = false;
let photosBase64 = [];
let analyseEnCours = null; // Dernière analyse pour sauvegarde

// ── DONNÉES ──
function getHisto() { return JSON.parse(localStorage.getItem('pc_arbitrage_histo') || '[]'); }
function setHisto(h) { localStorage.setItem('pc_arbitrage_histo', JSON.stringify(h)); }

// ── LOGIN ──
function login() {
  const pwd = document.getElementById('login-pwd').value;
  if (pwd === ADMIN_PWD) {
    adminConnecte = true;
    document.getElementById('alerte-login').style.display = 'none';
    document.getElementById('login-pwd').value = '';
    document.getElementById('nav-right').innerHTML = `<button onclick="logout()" style="background:none;border:1px solid var(--or);color:var(--or-clair);padding:6px 16px;cursor:pointer;font-family:Arial;font-size:12px;border-radius:2px">Déconnexion</button>`;
    showPage('main');
    renderHisto();
  } else {
    document.getElementById('alerte-login').style.display = 'block';
    document.getElementById('login-pwd').value = '';
    setTimeout(() => document.getElementById('login-pwd').focus(), 50);
  }
}

function logout() {
  adminConnecte = false;
  document.getElementById('nav-right').innerHTML = '';
  document.getElementById('login-pwd').value = '';
  showPage('login');
}

function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + id).classList.add('active');
  if (id === 'login') setTimeout(() => { const p = document.getElementById('login-pwd'); if(p) { p.value=''; p.focus(); } }, 50);
}

// ── PHOTOS ──
function handlePhotos(input) {
  const files = Array.from(input.files);
  photosBase64 = [];
  const grid = document.getElementById('photos-preview');
  grid.innerHTML = '';
  files.forEach((file, i) => {
    if (file.size > 8 * 1024 * 1024) { alert(file.name + ' trop lourd (max 8Mo)'); return; }
    const reader = new FileReader();
    reader.onload = e => {
      photosBase64[i] = e.target.result;
      const img = document.createElement('img');
      img.src = e.target.result;
      grid.appendChild(img);
      document.querySelector('#upload-zone p').textContent = `✓ ${files.length} photo(s) chargée(s)`;
    };
    reader.readAsDataURL(file);
  });
}

// ── RESET ──
function reset() {
  ['obj-titre', 'obj-notes', 'obj-prix'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('obj-categorie').selectedIndex = 0;
  document.getElementById('obj-pays').selectedIndex = 0;
  document.getElementById('obj-etat').selectedIndex = 1;
  photosBase64 = [];
  document.getElementById('photos-preview').innerHTML = '';
  document.getElementById('obj-photos').value = '';
  document.querySelector('#upload-zone p').textContent = '📷 Cliquez pour uploader (JPG/PNG, plusieurs photos possibles)';
  document.getElementById('analyse-box').style.display = 'none';
  document.getElementById('loading-box').style.display = 'none';
  analyseEnCours = null;
}

// ── ANALYSER ──
async function analyser() {
  const titre = document.getElementById('obj-titre').value.trim();
  const prix = document.getElementById('obj-prix').value;
  if (!titre) { alert('Entrez le titre de l\'objet.'); return; }
  if (!prix) { alert('Entrez le prix demandé.'); return; }

  const categorie = document.getElementById('obj-categorie').value;
  const pays = document.getElementById('obj-pays').value;
  const etat = document.getElementById('obj-etat').value;
  const notes = document.getElementById('obj-notes').value.trim();
  const paysLabel = pays === 'BE' ? 'Belgique' : 'France';
  const autresPays = pays === 'BE' ? 'France' : 'Belgique';

  const btn = document.getElementById('btn-analyser');
  btn.disabled = true;
  document.getElementById('loading-box').style.display = 'block';
  document.getElementById('analyse-box').style.display = 'none';

  try {
    const content = [];

    // Inclure photos si dispo
    if (photosBase64.length > 0 && photosBase64[0]) {
      const b64 = photosBase64[0].split(',')[1];
      const mt = photosBase64[0].startsWith('data:image/png') ? 'image/png' : 'image/jpeg';
      content.push({ type: 'image', source: { type: 'base64', media_type: mt, data: b64 } });
    }

    content.push({ type: 'text', text: `Tu es un expert en arbitrage d'antiquités et objets de collection entre la Belgique et la France. Tu connais parfaitement les différences de prix entre ces deux marchés.

Analyse cet objet pour déterminer s'il est sous-évalué, juste évalué ou sur-évalué, et si un arbitrage entre les deux pays est possible.

OBJET :
- Titre : ${titre}
- Catégorie : ${categorie}
- État : ${etat}
- Prix demandé : ${prix}€
- Pays de provenance : ${paysLabel}
- Notes : ${notes || 'aucune'}
${photosBase64.length > 0 ? '- Une photo est jointe' : ''}

Réponds UNIQUEMENT en JSON valide, sans texte avant ou après :
{
  "verdict": "SOUS-ÉVALUÉ",
  "verdict_emoji": "✅",
  "verdict_score": 85,
  "prix_marche_be_min": 120,
  "prix_marche_be_max": 180,
  "prix_marche_fr_min": 150,
  "prix_marche_fr_max": 220,
  "prix_achat_max_conseille": 100,
  "prix_revente_conseille": 160,
  "marge_estimee": 60,
  "pays_achat_conseille": "${paysLabel}",
  "pays_revente_conseille": "${autresPays}",
  "ecart_be_fr_pct": 25,
  "opportunite_arbitrage": true,
  "confiance": "haute",
  "analyse_marche": "Explication de 2-3 phrases sur la valeur de l'objet et les tendances de marché.",
  "analyse_be": "Explication courte sur le marché belge pour cet objet.",
  "analyse_fr": "Explication courte sur le marché français pour cet objet.",
  "conseil_arbitrage": "Conseil précis sur comment réaliser l'arbitrage si opportunité.",
  "points_attention": "Risques ou points à vérifier avant achat.",
  "mots_cles_recherche": ["mot1", "mot2", "mot3"]
}

Le champ verdict doit être : SOUS-ÉVALUÉ, JUSTE PRIX, ou SUR-ÉVALUÉ.
Le verdict_score est entre 0 et 100 (100 = excellente opportunité d'achat).
L'ecart_be_fr_pct est le pourcentage d'écart de prix entre les deux marchés.` });

    const response = await fetch('/.netlify/functions/claude-proxy', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: 'claude-sonnet-4-6', max_tokens: 1200, messages: [{ role: 'user', content }] })
    });

    const data = await response.json();
    const texte = data.content?.[0]?.text || '{}';
    let json;
    try {
      json = JSON.parse(texte.replace(/```json|```/g, '').trim());
    } catch(e) {
      throw new Error('Réponse IA invalide : ' + texte.substring(0, 150));
    }

    // Stocker pour sauvegarde
    analyseEnCours = { titre, categorie, prix: parseFloat(prix), pays, etat, notes, photos: photosBase64, json, date: new Date().toLocaleString('fr-BE') };

    // Afficher résultats
    afficherResultat(json, titre, pays, prix);

  } catch(e) {
    alert('Erreur : ' + e.message);
  } finally {
    btn.disabled = false;
    document.getElementById('loading-box').style.display = 'none';
  }
}

function afficherResultat(json, titre, pays, prix) {
  const paysLabel = pays === 'BE' ? '🇧🇪 Belgique' : '🇫🇷 France';
  const autresPaysLabel = pays === 'BE' ? '🇫🇷 France' : '🇧🇪 Belgique';

  // Titre
  document.getElementById('analyse-titre-obj').textContent = `⚖️ ${titre} — ${paysLabel} — ${prix}€`;

  // Verdict
  const vBox = document.getElementById('verdict-box');
  const couleurVerdict = json.verdict === 'SOUS-ÉVALUÉ' ? '#2e5e3e' : json.verdict === 'SUR-ÉVALUÉ' ? '#8b2e2e' : '#b7770d';
  const bgVerdict = json.verdict === 'SOUS-ÉVALUÉ' ? '#e8f4ec' : json.verdict === 'SUR-ÉVALUÉ' ? '#f4e8e8' : '#fff8e8';
  vBox.style.background = bgVerdict;
  vBox.style.border = `2px solid ${couleurVerdict}`;
  document.getElementById('verdict-text').style.color = couleurVerdict;
  document.getElementById('verdict-text').textContent = `${json.verdict_emoji} ${json.verdict}`;
  document.getElementById('verdict-sous').style.color = couleurVerdict;
  document.getElementById('verdict-sous').textContent = `Score d'opportunité : ${json.verdict_score}/100 — Confiance : ${json.confiance}`;

  // Grille prix
  document.getElementById('grille-prix').innerHTML = `
    <div class="prix-bloc" style="background:#f0f8ff;border:1px solid #c3d4f0">
      <div class="prix-bloc-label" style="color:#2c4a7a">🇧🇪 Marché Belge</div>
      <div class="prix-bloc-val" style="color:#2c4a7a">${json.prix_marche_be_min}€ — ${json.prix_marche_be_max}€</div>
      <div class="prix-bloc-sub" style="color:#2c4a7a">${json.analyse_be}</div>
    </div>
    <div class="prix-bloc" style="background:#fff0f0;border:1px solid #f0c3c3">
      <div class="prix-bloc-label" style="color:#8b2e2e">🇫🇷 Marché Français</div>
      <div class="prix-bloc-val" style="color:#8b2e2e">${json.prix_marche_fr_min}€ — ${json.prix_marche_fr_max}€</div>
      <div class="prix-bloc-sub" style="color:#8b2e2e">${json.analyse_fr}</div>
    </div>
    <div class="prix-bloc" style="background:#fff8e8;border:1px solid #f0d080">
      <div class="prix-bloc-label" style="color:#b7770d">🛒 Prix d'achat max conseillé</div>
      <div class="prix-bloc-val" style="color:#b7770d">${json.prix_achat_max_conseille}€</div>
      <div class="prix-bloc-sub" style="color:#b7770d">Ne pas dépasser ce prix</div>
    </div>
    <div class="prix-bloc" style="background:#e8f4ec;border:1px solid #c3dfc9">
      <div class="prix-bloc-label" style="color:#2e5e3e">💶 Prix de revente conseillé</div>
      <div class="prix-bloc-val" style="color:#2e5e3e">${json.prix_revente_conseille}€</div>
      <div class="prix-bloc-sub" style="color:#2e5e3e">Marge estimée : +${json.marge_estimee}€</div>
    </div>`;

  // Comparaison pays
  const arbClass = json.opportunite_arbitrage ? 'background:#e8f4ec;border:1px solid #c3dfc9' : 'background:#f4e8e8;border:1px solid #dfc3c3';
  document.getElementById('comparaison-pays').innerHTML = `
    <div style="${arbClass};border-radius:4px;padding:14px;font-family:Arial;font-size:13px">
      <strong>${json.opportunite_arbitrage ? '✅ Opportunité d\'arbitrage détectée' : '⚠️ Arbitrage peu intéressant'}</strong><br>
      Écart de prix BE/FR : <strong>${json.ecart_be_fr_pct}%</strong><br>
      ${json.opportunite_arbitrage ? `🛒 Acheter en <strong>${json.pays_achat_conseille}</strong> → Revendre en <strong>${json.pays_revente_conseille}</strong>` : 'Les marchés sont trop proches pour un arbitrage rentable.'}
    </div>`;

  // Conseils
  document.getElementById('conseil-box').innerHTML = `
    <strong>📊 Analyse marché :</strong> ${json.analyse_marche}<br><br>
    ${json.conseil_arbitrage ? `<strong>🎯 Stratégie :</strong> ${json.conseil_arbitrage}<br><br>` : ''}
    <strong>⚠️ Points d'attention :</strong> ${json.points_attention}<br><br>
    ${json.mots_cles_recherche?.length ? `<strong>🔍 Mots-clés de recherche :</strong> ${json.mots_cles_recherche.join(', ')}` : ''}`;

  document.getElementById('analyse-box').style.display = 'block';
}

// ── SAUVEGARDE ──
function sauvegarderAnalyse() {
  if (!analyseEnCours) return;
  const histo = getHisto();
  histo.unshift({ id: Date.now(), ...analyseEnCours });
  if (histo.length > 200) histo.pop(); // Max 200 entrées
  setHisto(histo);
  renderHisto();
  alert('✓ Analyse sauvegardée dans l\'historique !');
}

// ── HISTORIQUE ──
let filtreActif = 'tous';
function filtrerHisto(filtre) { filtreActif = filtre; renderHisto(); }

function renderHisto() {
  let histo = getHisto();
  const count = document.getElementById('histo-count');
  count.textContent = `(${histo.length})`;
  if (filtreActif !== 'tous') histo = histo.filter(h => h.json?.verdict === filtreActif);
  const el = document.getElementById('histo-list');
  if (!histo.length) { el.innerHTML = '<div class="section-vide">Aucune analyse.</div>'; return; }
  el.innerHTML = histo.map(h => {
    const j = h.json || {};
    const imgHTML = h.photos?.[0] ? `<img src="${h.photos[0]}">` : '🏺';
    const badgePays = h.pays === 'BE' ? '<span class="badge-pays badge-be">🇧🇪 BE</span>' : '<span class="badge-pays badge-fr">🇫🇷 FR</span>';
    const verdictClass = j.verdict === 'SOUS-ÉVALUÉ' ? 'tag-sous' : j.verdict === 'SUR-ÉVALUÉ' ? 'tag-sur' : 'tag-juste';
    const verdictEmoji = j.verdict === 'SOUS-ÉVALUÉ' ? '✅' : j.verdict === 'SUR-ÉVALUÉ' ? '❌' : '⚖️';
    return `
      <div class="histo-item" onclick="ouvrirDetail(${h.id})">
        <div class="histo-img">${imgHTML}</div>
        <div class="histo-info">
          <div class="histo-titre">${h.titre}</div>
          <div class="histo-meta">${badgePays} ${h.categorie} — Prix : ${h.prix}€ — ${h.date}</div>
          <div class="histo-verdict">
            <span class="${verdictClass}">${verdictEmoji} ${j.verdict || '—'}</span>
            ${j.marge_estimee ? `<span style="font-size:12px;color:var(--gris);margin-left:8px">Marge estimée : +${j.marge_estimee}€</span>` : ''}
            ${j.opportunite_arbitrage ? '<span style="font-size:12px;color:var(--vert);margin-left:8px">⚡ Arbitrage possible</span>' : ''}
          </div>
        </div>
        <div class="histo-actions" onclick="event.stopPropagation()">
          <button class="btn btn-or" style="padding:6px 12px;font-size:11px" onclick="rechargerAnalyse(${h.id})">↩ Recharger</button>
          <button class="btn btn-rouge" style="padding:6px 12px;font-size:11px" onclick="supprimerHisto(${h.id})">✕</button>
        </div>
      </div>`;
  }).join('');
}

function ouvrirDetail(id) {
  const h = getHisto().find(x => x.id === id);
  if (!h) return;
  const j = h.json || {};
  const paysLabel = h.pays === 'BE' ? '🇧🇪 Belgique' : '🇫🇷 France';
  document.getElementById('modal-detail-content').innerHTML = `
    <h2 style="color:var(--brun);font-size:20px;margin-bottom:6px">${h.titre}</h2>
    <div style="font-family:Arial;font-size:13px;color:var(--gris);margin-bottom:20px">${paysLabel} — ${h.categorie} — Prix : ${h.prix}€ — ${h.date}</div>
    ${h.photos?.[0] ? `<img src="${h.photos[0]}" style="width:100%;max-height:260px;object-fit:contain;border-radius:4px;margin-bottom:20px;background:#e8e0d5">` : ''}
    <div style="background:${j.verdict==='SOUS-ÉVALUÉ'?'#e8f4ec':j.verdict==='SUR-ÉVALUÉ'?'#f4e8e8':'#fff8e8'};border-radius:4px;padding:16px;text-align:center;margin-bottom:16px">
      <div style="font-size:24px;font-weight:bold;color:${j.verdict==='SOUS-ÉVALUÉ'?'#2e5e3e':j.verdict==='SUR-ÉVALUÉ'?'#8b2e2e':'#b7770d'}">${j.verdict_emoji} ${j.verdict}</div>
      <div style="font-size:13px;font-family:Arial;color:var(--gris);margin-top:4px">Score : ${j.verdict_score}/100 — Marge estimée : +${j.marge_estimee}€</div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;font-family:Arial;font-size:13px;margin-bottom:16px">
      <div style="background:#f0f8ff;border:1px solid #c3d4f0;padding:12px;border-radius:4px"><strong style="color:#2c4a7a">🇧🇪 BE :</strong><br>${j.prix_marche_be_min}€ — ${j.prix_marche_be_max}€</div>
      <div style="background:#fff0f0;border:1px solid #f0c3c3;padding:12px;border-radius:4px"><strong style="color:#8b2e2e">🇫🇷 FR :</strong><br>${j.prix_marche_fr_min}€ — ${j.prix_marche_fr_max}€</div>
      <div style="background:#fff8e8;border:1px solid #f0d080;padding:12px;border-radius:4px"><strong style="color:#b7770d">🛒 Achat max :</strong><br>${j.prix_achat_max_conseille}€</div>
      <div style="background:#e8f4ec;border:1px solid #c3dfc9;padding:12px;border-radius:4px"><strong style="color:#2e5e3e">💶 Revente :</strong><br>${j.prix_revente_conseille}€</div>
    </div>
    <div style="background:var(--creme);border:1px solid #ddd5c8;padding:14px;border-radius:4px;font-family:Arial;font-size:13px;line-height:1.7">
      <strong>Analyse :</strong> ${j.analyse_marche}<br><br>
      ${j.conseil_arbitrage ? `<strong>Stratégie :</strong> ${j.conseil_arbitrage}<br><br>` : ''}
      <strong>Points d'attention :</strong> ${j.points_attention}
    </div>`;
  document.getElementById('modal-detail').classList.add('open');
}

function rechargerAnalyse(id) {
  const h = getHisto().find(x => x.id === id);
  if (!h) return;
  document.getElementById('obj-titre').value = h.titre;
  document.getElementById('obj-prix').value = h.prix;
  document.getElementById('obj-notes').value = h.notes || '';
  document.getElementById('obj-etat').value = h.etat || 'tres-bon';
  // Pays
  document.getElementById('obj-pays').value = h.pays;
  // Afficher résultat
  analyseEnCours = h;
  afficherResultat(h.json, h.titre, h.pays, h.prix);
}

function supprimerHisto(id) {
  if (!confirm('Supprimer cette analyse ?')) return;
  setHisto(getHisto().filter(h => h.id !== id));
  renderHisto();
}

function viderHisto() {
  if (!confirm('Vider tout l\'historique ? Cette action est irréversible.')) return;
  setHisto([]);
  renderHisto();
}

// Init
document.getElementById('login-pwd').focus();
</script>
</body>
</html>
